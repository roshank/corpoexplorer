<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CorpoExplorer</title>
    <meta name="description" content="See where a public company's money comes from, per $100 of revenue, straight from its annual report." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='12' width='14' height='8' rx='2' fill='%232a78d6'/%3E%3Crect x='18' y='12' width='8' height='8' rx='2' fill='%23eb6834'/%3E%3Crect x='28' y='12' width='2' height='8' rx='1' fill='%231baf7a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="./">Corpo<span>Explorer</span></a>
    </header>

    <main>
      <section class="hero">
        <h1>Where does the money come from?</h1>
        <p class="lede">Pick a public company. We'll take its latest annual report and show where every $100 it brings in comes from.</p>

        <form class="search" id="search" autocomplete="off" role="search">
          <label class="visually-hidden" for="q">Company name or ticker</label>
          <input id="q" name="q" type="text" placeholder="Search a company or ticker, e.g. Apple or AAPL" spellcheck="false"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" />
          <button type="submit">Explore</button>
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </form>

        <div class="chips" id="chips" aria-label="Popular companies"></div>
      </section>

      <section id="result" class="result" aria-live="polite" hidden></section>
    </main>

    <footer class="foot">
      Data from public SEC filings (Form 10-K) via <a href="https://www.sec.gov/edgar" target="_blank" rel="noopener">EDGAR</a><span id="updated"></span>.
      Not investment advice.
    </footer>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
